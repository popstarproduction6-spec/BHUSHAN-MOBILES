name: Build BHUSHAN MOBILES APKs

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          unzip -o BhushanMobiles_Two_Panel_Apps.zip -d extracted

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Customer App
        run: |
          gradle -p extracted/bhushan_two_apps/CustomerApp assembleDebug --no-daemon

      - name: Build Owner App
        run: |
          gradle -p extracted/bhushan_two_apps/AdminApp assembleDebug --no-daemon

      - name: Upload Customer APK
        uses: actions/upload-artifact@v4
        with:
          name: BhushanMobiles-Customer
          path: extracted/bhushan_two_apps/CustomerApp/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Owner APK
        uses: actions/upload-artifact@v4
        with:
          name: BhushanMobiles-Owner
          path: extracted/bhushan_two_apps/AdminApp/app/build/outputs/apk/debug/app-debug.apk
